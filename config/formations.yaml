# 编队控制配置。上层控制统一使用 local_enu；PX4 bridge 负责和 PX4 local_ned 互转。
frame:
  command_frame: local_enu
  px4_internal_frame: local_ned
  conversion: "ROS targets use ENU: x=east, y=north, z=up. PX4 local position uses NED: x=north, y=east, z=down. Bridge conversion: enu.x=ned.y, enu.y=ned.x, enu.z=-ned.z."

controller:
  default_formation_type: triangle

  # 推荐 position_velocity：位置目标保证收敛，速度前馈让 follower 跟随更顺。
  # position_only 保留给问题定位或旧行为对比。
  control_mode: position_velocity

  # body_forward_right_up 表示 offset 随 leader yaw 旋转；local_enu 表示固定世界坐标偏移。
  offset_frame: body_forward_right_up

  # face_velocity 让机头朝速度方向；fixed 使用 waypoints.yaml 的固定 yaw。
  yaw_mode: face_velocity
  control_rate_hz: 10.0
  waypoint_acceptance_radius_m: 0.45
  leader_state_timeout_sec: 3.0
  leader_prediction_horizon_sec: 1.0

  # follower 速度命令中的 PD 增益和平滑限制，真机前需要在 SITL 中逐步调参。
  gains:
    kp_position: 0.8
    kd_velocity: 0.35
  smoothing:
    max_acceleration_m_s2: 1.5
    max_jerk_m_s3: 3.0
    low_pass_alpha: 0.35

# 发布 FormationTarget 前使用的软限制；底层 failsafe 仍由 PX4 负责。
safety:
  max_speed_m_s: 2.5
  max_altitude_m: 15.0
  min_altitude_m: 0.5
  min_inter_drone_distance_m: 1.2

# 队形 offset 默认按 swarm.drones 顺序自动生成；leader 固定为 [0, 0, 0]。
# 如需单机特殊位置，可在对应队形下用 offsets 覆盖，例如：
# offsets:
#   uav_4: [-4.0, 3.5, 0.0]
formations:
  triangle:
    description: "Leader in front, followers automatically expand as a wedge."
    generator:
      type: wedge
      longitudinal_spacing_m: 2.0
      lateral_spacing_m: 1.5
      z_offset_m: 0.0

  line:
    description: "Line abreast in ENU y-axis, centered on the leader."
    generator:
      type: line
      spacing_m: 2.0
      z_offset_m: 0.0

  column:
    description: "Single-file column behind the leader in ENU x-axis."
    generator:
      type: column
      spacing_m: 2.0
      z_offset_m: 0.0
