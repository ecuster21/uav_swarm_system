# 集群逻辑模型，由 swarm_manager、launch 文件和 formation_controller 共同读取。
# 多机身份映射规则：/uav_N 是项目内部 ROS namespace，px4_N 是 PX4 uXRCE-DDS 话题前缀，
# system_id 对应 PX4/MAVLink 系统编号，三者不要混用。
swarm:
  publish_rate_hz: 5.0
  state_timeout_sec: 2.0
  frame_id: local_enu
  leader_id: uav_1

  # 每个条目会启动一个 bridge 节点；initial_position 是 Gazebo 出生点在 local_enu 中的锚点。
  drones:
    - id: uav_1
      namespace: uav_1
      role: leader
      system_id: 2
      px4_topic_prefix: px4_1
      initial_position: [0.0, 0.0, 1.0]

    - id: uav_2
      namespace: uav_2
      role: follower
      system_id: 3
      px4_topic_prefix: px4_2
      initial_position: [3.0, 0.0, 1.0]

    - id: uav_3
      namespace: uav_3
      role: follower
      system_id: 4
      px4_topic_prefix: px4_3
      initial_position: [0.0, 3.0, 1.0]

# mock 用于不启动 PX4/Gazebo 的快速联调；真实 PX4 主线使用 uxrce_dds。
backend:
  default_type: mock
  supported_types:
    - mock
    - uxrce_dds

mock_backend:
  state_rate_hz: 10.0
  max_speed_m_s: 1.5
  takeoff_altitude_m: 2.5

# C++ px4_bridge_uxrce 参数；Offboard setpoint 频率要稳定高于 PX4 failsafe 要求。
uxrce_backend:
  state_rate_hz: 10.0
  offboard_rate_hz: 20.0
  enable_offboard_from_target: true
  offboard_warmup_cycles: 10
  takeoff_altitude_m: 2.5
  topic_assumption: "PX4 v1.14.4 rcS starts uxrce_dds_client with namespace px4_$px4_instance for nonzero multi-instance SITL. The stock gazebo-classic/sitl_multiple_run.sh starts instances 1..N, so topics are /px4_1/fmu/*, /px4_2/fmu/*, /px4_3/fmu/*."
