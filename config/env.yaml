# 固定开发环境配置文件。
# 作用：记录本项目必须遵守的系统版本、源码路径和运行边界。
# 该文件主要用于文档、脚本和人工核对，不用于自动升级任何依赖。

# 操作系统、ROS2、Gazebo 和 QGC 运行位置。
system:
  # 开发系统环境。
  os: "WSL2 Ubuntu 22.04"
  # 固定 ROS2 发行版。
  ros2: "Humble"
  # 固定 Gazebo 版本，当前项目使用 Gazebo Classic，不切换新 Gazebo。
  gazebo: "Gazebo Classic 11.10.2"
  # QGroundControl 运行位置；它在 Windows 主机，不在 WSL2 内。
  qgroundcontrol: "Windows host"

# PX4 固定版本和源码路径。
px4:
  # 固定 PX4 版本，不切换 main、v1.15 或 v1.16。
  version: "v1.14.4"
  # PX4-Autopilot 源码路径；主项目只引用，不复制 PX4 源码。
  source_dir: "/home/jie/PX4-Autopilot"

# Micro XRCE-DDS Agent 固定版本和源码路径。
micro_xrce_dds_agent:
  # 固定 MicroXRCEAgent 版本，不升级到 3.x。
  version: "2.4.1"
  # Micro-XRCE-DDS-Agent 源码路径；主项目只引用，不复制源码。
  source_dir: "/home/jie/Micro-XRCE-DDS-Agent"

# 主项目路径。
project:
  # UAV swarm system 主项目根目录。
  root_dir: "/home/jie/uav_swarm_system"

# 运行时主线约束。
runtime:
  # 主工程是否允许 ROS1 作为运行依赖；本项目主线禁止 ROS1。
  ros1_allowed: false
  # 主通信和节点框架。
  main_middleware: "ROS2"
  # 固定飞控系统。
  autopilot: "PX4"
  # 第一阶段优先验证目标。
  first_target: "PX4 SITL multi-vehicle simulation"
  # 后续部署目标。
  later_target: "RK3588 companion computer deployment"
